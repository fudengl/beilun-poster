<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>北崙里｜劉福登 政見</title>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Noto Sans TC", "PingFang TC",
      "Microsoft JhengHei", sans-serif;
    background: linear-gradient(180deg, #f3f6fa 0%, #ffffff 100%);
    color: #263238;
    line-height: 1.7;
  }
  .page {
    width: min(100% - 24px, 760px);
    margin: 0 auto;
    padding: 18px 0 40px;
  }
  .hero {
    position: relative;
    overflow: hidden;
    background: linear-gradient(135deg, #334e68, #486581);
    color: white;
    border-radius: 24px;
    padding: 34px 24px 30px;
    text-align: center;
    box-shadow: 0 12px 32px rgba(51,78,104,.20);
  }
  .hero::before, .hero::after {
    content: "";
    position: absolute;
    border-radius: 50%;
    background: rgba(255,255,255,.10);
  }
  .hero::before { width: 150px; height: 150px; top: -70px; right: -45px; }
  .hero::after { width: 105px; height: 105px; bottom: -55px; left: -25px; }
  .district {
    position: relative;
    font-size: 17px;
    letter-spacing: .12em;
    opacity: .94;
  }
  h1 {
    position: relative;
    margin: 5px 0 0;
    font-size: clamp(36px, 10vw, 52px);
    letter-spacing: .08em;
    font-weight: 800;
  }
  .subtitle {
    position: relative;
    display: inline-block;
    margin-top: 8px;
    padding: 4px 18px;
    border: 1px solid rgba(255,255,255,.58);
    border-radius: 999px;
    font-size: 19px;
    font-weight: 700;
    letter-spacing: .12em;
  }
  .intro {
    text-align: center;
    margin: 25px 4px 16px;
    color: #66788a;
    font-size: 16px;
  }
  .platform {
    display: grid;
    gap: 13px;
  }
  .item {
    display: grid;
    grid-template-columns: 52px 1fr;
    align-items: center;
    gap: 12px;
    padding: 16px 17px;
    background: rgba(255,255,255,.98);
    border: 1px solid #dfe6ed;
    border-radius: 17px;
    box-shadow: 0 5px 16px rgba(40,55,70,.07);
  }
  .icon {
    width: 48px;
    height: 48px;
    display: flex;
    align-items: center;
    justify-content: center;
    border-radius: 14px;
    background: #edf2f7;
    font-size: 25px;
  }
  .icon-wrap {
    position: relative;
    width: 48px;
    height: 48px;
  }
  .number {
    position: absolute;
    right: -5px;
    bottom: -5px;
    width: 20px;
    height: 20px;
    border-radius: 50%;
    background: #486581;
    color: white;
    font-size: 10px;
    line-height: 20px;
    text-align: center;
    font-weight: 800;
    border: 2px solid white;
    z-index: 2;
  }
  .text {
    font-size: 18px;
    font-weight: 600;
    color: #303b45;
  }
  .item:first-child .text { font-size: 17px; }
  .footer {
    text-align: center;
    margin-top: 24px;
    color: #8996a3;
    font-size: 13px;
  }
  @media (max-width: 480px) {
    .page { width: min(100% - 16px, 760px); padding-top: 8px; }
    .hero { border-radius: 20px; padding: 28px 17px 25px; }
    .item { grid-template-columns: 48px 1fr; padding: 14px 12px; gap: 10px; }
    .icon-wrap { width: 44px; height: 44px; }
    .icon { width: 44px; height: 44px; font-size: 23px; }
    .text, .item:first-child .text { font-size: 16.5px; }
  }
</style>
</head>
<body>
  <main class="page">
    <header class="hero">
      <div class="district">北崙里 里長候選人</div>
      <h1>劉福登</h1>
      <div class="subtitle">政見</div>
    </header>

    <p class="intro">一起打造更便利、更整潔、更友善的北崙里</p>

    <section class="platform">
      <div class="item">
        <div class="icon-wrap"><div class="icon">🤝</div><div class="number">1</div></div>
        <div class="text">當選後每月提撥事務費兩萬元作為弱勢、助學、急難救助及其他服務基金。</div>
      </div>
      <div class="item">
        <div class="icon-wrap"><div class="icon">🛣️</div><div class="number">2</div></div>
        <div class="text">路平、燈亮、水溝通</div>
      </div>
      <div class="item">
        <div class="icon-wrap"><div class="icon">💧</div><div class="number">3</div></div>
        <div class="text">老舊排水溝定期修繕</div>
      </div>
      <div class="item">
        <div class="icon-wrap"><div class="icon">🧹</div><div class="number">4</div></div>
        <div class="text">環境定期消毒清潔</div>
      </div>
      <div class="item">
        <div class="icon-wrap"><div class="icon">🏠</div><div class="number">5</div></div>
        <div class="text">開放集會所供里民使用</div>
      </div>
      <div class="item">
        <div class="icon-wrap"><div class="icon">🐕</div><div class="number">6</div></div>
        <div class="text">公園提供狗屎袋</div>
      </div>
      <div class="item">
        <div class="icon-wrap"><div class="icon">🍱</div><div class="number">7</div></div>
        <div class="text">贊助提升學校營養午餐</div>
      </div>
    </section>

    <div class="footer">北崙里｜劉福登政見</div>
  </main>
</body>
</html>
